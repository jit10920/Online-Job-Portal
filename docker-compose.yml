version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: job_portal_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_portal
      MYSQL_USER: job_user
      MYSQL_PASSWORD: job_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
